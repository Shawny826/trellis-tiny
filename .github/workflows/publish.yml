# Push-to-main CI: build + test always; publish a GitHub Release with the
# packed tarball when the version in tiny/package.json is new.
# No external tokens needed — the workflow's own GITHUB_TOKEN creates the
# release. Install: npm i -g https://github.com/Shawny826/trellis-tiny/
# releases/download/vX.Y.Z/trellis-tiny-X.Y.Z.tgz
name: build-and-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create release + tag

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build & test
        working-directory: tiny
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Release when version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./tiny/package.json').version")"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release ${TAG} already exists — skipping"
            exit 0
          fi
          (cd tiny && npm pack --pack-destination "$RUNNER_TEMP")
          FILENAME="trellis-tiny-${VERSION}.tgz"
          TARBALL="$RUNNER_TEMP/$FILENAME"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "trellis-tiny ${VERSION}" \
            --notes "Install: \`npm i -g https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILENAME}\`" \
            "$TARBALL"
